name: Correction
description: Report a specific error or propose a correction to an existing note page.
title: "[Correction]: "
labels:
  - feedback
  - correction
body:
  - type: input
    id: page_path
    attributes:
      label: Page path
      description: Path to the note page that needs correction.
      placeholder: notes/subjects/physics/thermodynamics-i/thermodynamics-i.md
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: Problem type
      options:
        - Factual error
        - Calculation or equation error
        - Typo or wording
        - Broken link or citation
        - Formatting or structure
        - Other
    validations:
      required: true

  - type: textarea
    id: current_text
    attributes:
      label: Current text
      description: Paste the exact text, equation, or section that is wrong.
      placeholder: Quote the current content here.
    validations:
      required: true

  - type: textarea
    id: suggested_change
    attributes:
      label: Suggested change
      description: Provide the corrected wording, equation, or content.
      placeholder: Explain what should replace the current text.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain why the current content is incorrect or incomplete.
      placeholder: Include the logic behind the correction.
    validations:
      required: true

  - type: textarea
    id: source_reference
    attributes:
      label: Source/reference
      description: Cite the source used to justify the correction.
      placeholder: Book title, chapter, edition, URL, or paper citation.
    validations:
      required: true
