name: Minify and rebuild site assets

on:
  push:

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Minify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in site.js notes/notes.js notes/notes-runtime.js; do
            temporary_file="${file}.min.tmp"
            npx --yes terser@5.44.0 "$file" --compress --mangle --comments false --output "$temporary_file"
            mv "$temporary_file" "$file"
          done

      - name: Minify CSS
        shell: bash
        run: |
          set -euo pipefail
          for file in site.css notes/notes.css; do
            temporary_file="${file}.min.tmp"
            npx --yes clean-css-cli@5.6.3 -o "$temporary_file" "$file"
            mv "$temporary_file" "$file"
          done

      - name: Rebuild generated notes pages
        run: npm run build:notes

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: minify and rebuild assets [skip ci]"
          file_pattern: "*.js *.css *.html notes/**/*.html notes/search-index.json sitemap.xml"
