<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adriamics | Newsroom</title>
  <meta name="description"
    content="Adriamics is an aerospace and software research company with newsroom updates on the home page." />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/png" href="index/assets/icon.png" />
  <link rel="apple-touch-icon" href="index/assets/icon.png" />
  <link rel="stylesheet" href="index/assets/index.css" />
</head>

<body class="home-page" data-page="home" id="top">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="home-bg" aria-hidden="true"></div>

  <header class="site-header">
    <div class="shell nav">
      <a class="brand" href="index.html" aria-label="Adriamics home">
        <span>Adriamics</span>
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="portfolio/">Portfolio</a>
      </nav>
    </div>
  </header>

  <main id="content">
    <section class="hero">
      <div class="shell hero-grid">
        <div class="hero-copy">
          <img class="hero-mark" src="index/assets/logo.png" alt="Adriamics logo" width="2172" height="724"
            loading="eager" fetchpriority="high" />
          <!-- <p class="eyebrow">Newsroom</p>
          <p class="lede">Adriamics publishes company updates, articles, and announcements here.</p> -->
        </div>
      </div>
    </section>

    <section class="section" id="newsroom">
      <div class="shell section-panel">
        <div class="section-head">
          <div>
            <h2 class="section-title">Latest newsroom</h2>
            <p class="section-note">Browse updates by publish year.</p>
          </div>
        </div>
        <div class="news-year-filter">
          <p class="section-label">Years</p>
          <div class="news-year-buttons" id="home-news-years" aria-label="Filter newsroom by year"></div>
        </div>
        <div class="archive-list" id="home-news" data-sort="date-desc"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer" aria-label="Footer">
    <div class="shell site-footer__inner">
      <a href="mailto:contact@adriamics.com" data-copy-text="contact@adriamics.com"
        data-copy-temp-label="&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;copied&#160;&#160;&#160;&#160;&#160;&#160;&#160;">contact@adriamics.com</a>
      <span class="site-footer__sep" aria-hidden="true">-</span>
      <a href="terms-of-service/">Terms of Service</a>
      <span class="site-footer__sep" aria-hidden="true">-</span>
      <a href="privacy-policy/">Privacy Policy</a>
      <span class="site-footer__sep" aria-hidden="true">-</span>
      <a href="#top">Back to top</a>
    </div>
  </footer>

  <script src="index/site-data.js"></script>
  <script src="index/assets/index.js"></script>
</body>

</html>
