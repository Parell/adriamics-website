<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adriamics</title>
  <meta name="description" content="Adriamics homepage currently under construction." />
  <meta name="color-scheme" content="dark" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #06070a;
      --panel: rgba(14, 16, 20, 0.92);
      --line: rgba(255, 255, 255, 0.12);
      --text: #f0f2f5;
      --muted: #aab0ba;
      --accent: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font: 400 16px/1.6 "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 30%),
        linear-gradient(180deg, #0d1015 0%, var(--bg) 60%, #040506 100%);
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .card {
      width: min(100%, 38rem);
      padding: clamp(2rem, 5vw, 3rem);
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .eyebrow {
      margin: 0 0 0.9rem;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    p {
      margin: 1rem 0 0;
      max-width: 28rem;
      color: var(--muted);
    }

    a {
      color: var(--text);
    }

    .links {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0.55rem 1rem;
      border: 1px solid var(--line);
      text-decoration: none;
      transition: transform 120ms ease, border-color 120ms ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .button--primary {
      background: rgba(255, 255, 255, 0.04);
      color: var(--accent);
    }

    @media (max-width: 640px) {
      main {
        padding: 1rem;
      }

      .card {
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="card" aria-labelledby="site-title">
      <p class="eyebrow">Adriamics</p>
      <h1 id="site-title">Work in progress</h1>
      <p>This site is being rebuilt. The current portfolio is still available below.</p>
      <div class="links">
        <a class="button button--primary" href="portfolio/">Open portfolio</a>
      </div>
    </section>
  </main>
</body>

</html>
