<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daniel D. John // Portfolio</title>
  <meta name="description" content="Dark, text-forward GitHub Pages portfolio for Daniel D. John." />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="assets/site.css" />
</head>

<body class="home-page">
  <a class="skip-link" href="#projects">Skip to projects</a>

  <div class="backdrop" aria-hidden="true">
    <div class="text-stream" id="text-stream" aria-hidden="true"></div>
  </div>

  <header class="site-header">
    <div class="shell nav">
      <a class="brand" href="#top" id="brand-link">Daniel D. John</a>
      <nav class="nav-links" aria-label="Primary">
        <a id="github-nav" href="#" target="_blank" rel="noreferrer">GitHub</a>
        <a id="linkedin-nav" href="#" target="_blank" rel="noreferrer">LinkedIn</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="shell hero" aria-labelledby="hero-title">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-title"></h1>
      <p class="lede" id="hero-lede"></p>
      <div class="hero-meta">
        <p id="hero-support"></p>
        <div class="hero-links">
          <a id="hero-github" href="#" target="_blank" rel="noreferrer">github: @your-username</a>
          <a id="hero-linkedin" href="#" target="_blank" rel="noreferrer">LinkedIn</a>
          <button id="hero-email" class="copy-email" type="button" data-copy-email="you@example.com"
            data-copy-state="idle" title="Copy email to clipboard">
            <span class="copy-email__label" data-copy-email-label>email: you@example.com</span>
            <span class="copy-email__hint" data-copy-email-hint aria-hidden="true">copy</span>
            <span class="sr-only" data-copy-email-status aria-live="polite"></span>
          </button>
          <a id="hero-resume" href="Daniel John - Resume.pdf" target="_blank" rel="noreferrer">resume: PDF</a>
          <a id="hero-plans" href="https://github.com/users/Parell/projects/6" target="_blank" rel="noreferrer">plans:&nbsp;<img src="icons8-lock-24.png" alt="" width="16" height="16" aria-hidden="true" /></a>
        </div>
      </div>
    </section>

    <section class="shell section" id="featured" aria-labelledby="featured-title">
      <article class="card featured">
        <div class="section-label" id="featured-meta"></div>
        <h2 id="featured-title"></h2>
        <p id="featured-summary"></p>
        <div class="featured-footer">
          <a class="read-more" id="featured-link" href="#">Read post -&gt;</a>
        </div>
      </article>
    </section>

    <section class="shell section" id="projects" aria-labelledby="projects-title">
      <div class="section-head">
        <div class="section-title" id="projects-title">Projects</div>
        <div class="section-note" id="projects-note"></div>
      </div>
      <div class="project-grid" id="projects-list"></div>
    </section>

    <section class="shell section" id="blog" aria-labelledby="blog-title">
      <div class="section-head">
        <div class="section-title" id="blog-title">Blog</div>
        <div class="section-note" id="blog-note"></div>
      </div>
      <div class="project-grid" id="blog-list"></div>
    </section>

    <footer class="shell footer" id="contact">
      <div class="footer__inner" id="footer-text"></div>
    </footer>
  </main>

  <script src="assets/site-home.js"></script>
</body>

</html>
