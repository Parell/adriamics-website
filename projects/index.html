<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects | Adriamics</title>
  <meta
    name="description"
    content="A searchable directory of Adriamics aerospace and software research projects."
  />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/png" href="../assets/icon.png" />
  <link rel="stylesheet" href="../assets/index.css" />
</head>

<body data-page="projects">
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="shell nav">
      <a class="brand" href="../index.html" aria-label="Adriamics home">
        <span>Adriamics</span>
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="../index.html">Home</a>
        <a href="../projects/" aria-current="page">Projects</a>
        <a href="../index.html#careers">Careers</a>
      </nav>
    </div>
  </header>

  <main id="content">
    <section class="page-title-block">
      <div class="shell">
        <p class="eyebrow">Research library</p>
        <h1 class="page-title">Find project and publication material fast.</h1>
        <p class="lede">
          Search the shared directory, jump to a topic, and open the related notes and papers from each card.
        </p>
      </div>
    </section>

    <section class="section">
      <div class="shell section-panel">
        <div class="filter-bar">
          <input
            id="project-search"
            class="search-field"
            type="search"
            placeholder="Search by title, status, discipline, venue, or topic"
            aria-label="Search library"
          />
          <div class="chips" aria-label="Project filters">
            <button class="chip is-active" type="button" data-project-filter="">All</button>
            <button class="chip" type="button" data-project-filter="project">Projects</button>
            <button class="chip" type="button" data-project-filter="publication">Publications</button>
            <button class="chip" type="button" data-project-filter="software">Software</button>
            <button class="chip" type="button" data-project-filter="aerospace">Aerospace</button>
            <button class="chip" type="button" data-project-filter="data">Data</button>
            <button class="chip" type="button" data-project-filter="operations">Operations</button>
          </div>
        </div>
        <div class="card-grid" id="projects-list" data-sort="date-desc"></div>
      </div>
    </section>
  </main>

  <script src="../index/site-data.js"></script>
  <script src="../assets/index.js"></script>
</body>

</html>
