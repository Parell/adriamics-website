<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Frame is Adriamics' engineering environment for designing and verifying spacecraft missions." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Frame — Adriamics" />
  <meta property="og:description" content="One mission model from trajectory design through closed-loop flight simulation." />
  <link rel="canonical" href="https://adriamics.com/frame/" />

  <link rel="icon" type="image/png" href="/assets/favicon.png" />

<body class="project-page">
  <a class="skip-link" href="#content">Skip to content</a>
  <!-- shared-site-header -->
  <main id="content" class="shell project-detail">
    <p class="eyebrow">02 / Build</p>
    <h1>Frame</h1>
    <p class="project-detail__lede">{{project.frame.headline}}</p>
    <figure class="pipeline-figure">
      <svg viewBox="0 0 900 260" role="img" aria-labelledby="frame-diagram-title frame-diagram-desc">
        <title id="frame-diagram-title">Frame mission workflow</title>
        <desc id="frame-diagram-desc">Mission definition flows through design, optimization, verification, and guidance, navigation, and control with flight software.</desc>
        <path class="diagram-line" d="M90 128H810" />
        <g class="diagram-node"><circle cx="90" cy="128" r="34" /><text x="90" y="188">MISSION</text></g>
        <g class="diagram-node"><circle cx="270" cy="128" r="34" /><text x="270" y="188">DESIGN</text></g>
        <g class="diagram-node"><circle cx="450" cy="128" r="34" /><text x="450" y="188">OPTIMIZE</text></g>
        <g class="diagram-node"><circle cx="630" cy="128" r="34" /><text x="630" y="188">VERIFY</text></g>
        <g class="diagram-node"><circle cx="810" cy="128" r="34" /><text x="810" y="188">GNC / FSW</text></g>
      </svg>
      <figcaption class="eyebrow">A connected mission model, from design intent to verified behavior.</figcaption>
    </figure>
    <dl class="project-status"><div><dt>Status</dt><dd>{{project.frame.status}}</dd></div><div><dt>Version</dt><dd>{{project.frame.version}}</dd></div></dl>
    <a class="text-link" href="/study/">Start with Study <span aria-hidden="true">↗</span></a>
  </main>
  <!-- shared-site-footer -->
</body>
</html>
