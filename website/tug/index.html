        <circle class="orbit-center" cx="450" cy="190" r="3" />
      </svg>
      <figcaption class="eyebrow">Orbital transport research / concept schematic</figcaption>
    </figure>
    <dl class="project-status"><div><dt>Status</dt><dd>{{project.solar-tug.status}}</dd></div><div><dt>Technical details</dt><dd>To be announced</dd></div></dl>
